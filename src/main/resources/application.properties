server.port=8080

# --- SQLite (local file database - no server, no username/password) ---
# The file is created automatically in the project's working directory
# the first time the app starts.
spring.datasource.url=jdbc:sqlite:expense_tracker.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate ships no official SQLite dialect, so we point it at the
# community-maintained one pulled in via hibernate-community-dialects.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# "update" auto-creates/updates tables to match the entities during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Error messages ---
server.error.include-message=always
