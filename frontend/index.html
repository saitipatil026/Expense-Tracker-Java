<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Finance Tracker</title></head>
<body>
  <div id="app">
    <div class="finance-card">
      <div id="authSection">
        <h1>Finance Tracker</h1>
        <form id="loginForm">
          <h2>Login</h2>
          <input id="loginUser" placeholder="Username" required>
          <input id="loginPass" type="password" placeholder="Password" required>
          <button type="submit">Login</button>
          <div class="link" onclick="document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.remove('hidden')">New user? Register</div>
        </form>
        <form id="registerForm" class="hidden">
          <h2>Register</h2>
          <input id="regUser" placeholder="Username" required>
          <input id="regEmail" placeholder="Email" required>
          <input id="regPass" type="password" placeholder="Password" required>
          <button type="submit">Register</button>
          <div class="link" onclick="document.getElementById('registerForm').classList.add('hidden'); document.getElementById('loginForm').classList.remove('hidden')">Already have account? Login</div>
        </form>
        <div id="authMsg"></div>
      </div>

      <div id="appSection" class="hidden">
        <h2>Welcome, <span id="userName"></span> <button onclick="logout()" style="width:auto; padding:5px 10px; float:right;">Logout</button></h2>
        <div class="summary-box"><b>Total: ₹<span id="totalAmount">0</span></b><div id="categoryTotals"></div></div>
        <form id="expenseForm">
          <input type="hidden" id="editId">
          <input id="desc" placeholder="Description" required>
          <input id="amount" type="number" placeholder="Amount" required>
          <select id="category"><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Other</option></select>
          <input id="date" type="date">
          <button type="submit" id="submitBtn">Add Expense</button>
          <button type="button" id="cancelBtn" class="hidden secondary" onclick="cancelEdit()">Cancel</button>
        </form>
        <ul id="expenseList"></ul>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
